<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Source de assets/og-image.png (1200×630) et assets/apple-touch-icon.png.
     Régénérer : node tools/render-og.js -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#0b0b0b; --paper:#f1ede2; --acid:#d7ff1e; --pink:#ff3fa4; --blue:#2d2dff; --orange:#ff5b14; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Space Mono", monospace; color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(rgba(11,11,11,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(11,11,11,.07) 1px, transparent 1px);
    background-size: 30px 30px; position: relative; }
  .top { position: absolute; inset: 0 0 auto 0; height: 64px; background: var(--acid); border-bottom: 4px solid var(--ink);
    display: flex; align-items: center; justify-content: space-between; padding: 0 48px; font: 700 20px "Space Mono"; text-transform: uppercase; }
  .top b { font: 30px "Archivo Black"; letter-spacing: -.02em; }
  .kicker { position: absolute; left: 48px; top: 106px; background: #fff; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    padding: 8px 14px; font: 700 22px "Space Mono"; text-transform: uppercase; }
  h1 { position: absolute; left: 40px; top: 190px; font: 176px/1 "Archivo Black"; letter-spacing: -.045em; white-space: nowrap; }
  h1 span { display: inline-block; }
  .s { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; letter-spacing: 0; }
  .o { color: transparent; -webkit-text-stroke: 5px var(--ink); }
  .p { color: var(--pink); } .b { color: var(--blue); }
  .lead { position: absolute; left: 48px; bottom: 112px; font: 700 27px/1.45 "Space Mono"; }
  .lead mark { background: var(--acid); border: 3px solid var(--ink); padding: 0 6px; }
  .lead mark.p2 { background: var(--pink); color: var(--ink); }
  .band { position: absolute; left: -20px; right: -20px; bottom: 26px; height: 64px; background: var(--ink); color: var(--acid);
    transform: rotate(-1.2deg); display: flex; align-items: center; gap: 26px; padding-left: 60px; font: 28px "Archivo Black"; white-space: nowrap; }
  .band i { color: var(--pink); font-style: normal; }
  .badge { position: absolute; right: 44px; top: 84px; width: 196px; height: 196px; transform: rotate(-14deg); }
  .badge text { font: 700 16px "Space Mono"; letter-spacing: 1.5px; }
  .sticker { position: absolute; right: 70px; bottom: 120px; background: var(--pink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    padding: 12px 18px; font: 24px/1.1 "Archivo Black"; text-align: center; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="top"><b>LA BÜTIQUE™</b><span>Ouverture le 31 növembre</span></div>
  <p class="kicker">Cöncept-störe · Haut-Marais · Paris 3e</p>
  <h1><span class="o">L</span><span class="s">A</span> <span>B</span><span class="b">Ü</span><span class="s">T</span><span class="o">I</span><span class="p">Q</span><span>U</span><span class="o">E</span></h1>
  <p class="lead">Le premier cöncept-störe <mark>éphémère-sédentaire</mark><br>basé sur le <mark class="p2">share-care</mark> et le rebranding.</p>
  <svg class="badge" viewBox="0 0 200 200">
    <defs><path id="c" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
    <circle cx="100" cy="100" r="98" fill="#d7ff1e" stroke="#0b0b0b" stroke-width="4"/>
    <text><textPath href="#c">ÉPHÉMÈRE · SÉDENTAIRE · ÉPHÉMÈRE · SÉDENTAIRE · </textPath></text>
    <text x="100" y="124" text-anchor="middle" style="font: italic 76px 'Instrument Serif'">π</text>
  </svg>
  <div class="sticker">SUR LISTE<br>D'ATTENTE</div>
  <div class="band"><span>CÖNCERT</span><i>✺</i><span>ALIMENTATIÖN</span><i>✺</i><span>SECÖNDE MAIN</span><i>✺</i><span>ËVENTS</span><i>✺</i><span>DEL-FINE™</span><i>✺</i><span>SHARE-CARE</span></div>
</body>
</html>
